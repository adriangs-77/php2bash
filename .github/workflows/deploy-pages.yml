name: Deploy to GitHub Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # @angular/cli 22 exige ^22.22.3 || ^24.15.0 || >=26
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # GitHub Pages sirve el sitio en https://adriangs-77.github.io/php2bash/,
      # por eso el base-href debe incluir el nombre del repositorio.
      - name: Build (prerender estático)
        run: npm run build:pages

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Solo el bundle de navegador: Pages no ejecuta el servidor SSR.
          # El HTML ya va prerenderizado gracias a RenderMode.Prerender.
          path: dist/php2bash/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
